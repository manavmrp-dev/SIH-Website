<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>JANM AI</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var base = '/SIH-Website';
        if (path.indexOf(base) === 0) {
          path = path.substring(base.length) || '/';
        }
        var target = window.location.origin + base + '/#' + path;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
